# Demo mode: made-up data and stand-in models, so every tab has something to show.
# Built by demo.bat (or: python -m rohingya_translate.demo). Nothing here is real Rohingya.

[pipeline]
mode = "direct"
synthesizer = "windows"   # read English aloud with a built-in Windows voice; "" for none
read_aloud = true         # the app speaks each translation automatically

[synthesizer]
voice = "Zira"            # part of a Windows voice name ("David", "Zira")
rate = 0                  # -10 (slow) to 10 (fast)

[speech_translator]
backend = "demo"                          # recognises the demo recordings only
phrasebook = "data/demo/phrasebook.csv"

[speech_to_text]
backend = "echo"

[text_translator]
backend = "echo"

[audio_embedder]
backend = "echo"

[image_labeler]
backend = "demo"                          # recognises the demo picture cards only

[lexicon]
path = "data/demo/lexicon"                # kept apart from the real dictionary
match_threshold = 0.9
min_speakers = 3
max_conflict_share = 0.25
vision_min_score = 0.01
prompts = "data/demo/prompts"            # pictures named after what they show
vocabulary = "configs/vision_vocabulary.txt"
